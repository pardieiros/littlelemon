{% extends 'base.html' %}
{% load static %}

{% block content %}
<section>
  <article>
    <h1>Make a reservation</h1>
    <div class="row">
      <div class="column">
        <form id="form">
          {% csrf_token %}
          {{ form.as_p }}
          <button id="button" type="button">Reserve</button>
        </form>
      </div>
      <div class="column">
        <h2>Bookings For <span id="today"></span></h2>
        <div id="bookings">Loading…</div>
      </div>
    </div>
  </article>
</section>
{% comment %}
  Meta tag para capturar facilmente o CSRF no JS
{% endcomment %}
<meta name="csrf-token" content="{{ csrf_token }}">
<script>
  const API = "{% url 'booking-list' %}"; 
  const csrftoken = document.querySelector('meta[name="csrf-token"]').content;

  // Seta o datepicker para hoje
  const dateInput = document.getElementById('reservation_date');
  const today = new Date();
  const formatted = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  dateInput.value = formatted;
  document.getElementById('today').innerText = formatted;

  // Função para formatar horas no select
  function formatTime(slot) {
    const ampm = slot < 12 ? 'AM' : 'PM';
    const h = slot % 12 === 0 ? 12 : slot % 12;
    return `${h} ${ampm}`;
  }

  // Busca reservas do dia
  async function getBookings(date) {
    date = date || dateInput.value;
    document.getElementById('today').innerText = date;
    // Nota: use o nome do campo do serializer, assumindo que ele é reservation_date
    const res = await fetch(`${API}?reservation_date=${date}`);
    const data = await res.json();

    // popula lista de horários ocupados
    const reserved = data.map(item => parseInt(item.reservation_time.split(':')[0], 10));
    // exibe nomes
    const listing = data.length
      ? data.map(item => `<p>${item.first_name} – ${formatTime(reserved.shift())}</p>`).join('')
      : '<p>No bookings</p>';
    document.getElementById('bookings').innerHTML = listing;

    // constrói o <select> de horários (11–19)
    let options = '<option disabled>Select time</option>';
    for (let i = 11; i < 20; i++) {
      const used = reserved.includes(i);
      options += `<option value="${i}"${used?' disabled':''}>${formatTime(i)}</option>`;
    }
    document.getElementById('reservation_slot').innerHTML = options;
  }

  // Inicializa
  getBookings();

  // Recarrega ao mudar data
  dateInput.addEventListener('change', e => getBookings(e.target.value));

  // Submissão da reserva
  document.getElementById('button').addEventListener('click', async () => {
    const payload = {
      first_name:   document.getElementById('first_name').value,
      reservation_date: document.getElementById('reservation_date').value,
      reservation_time: document.getElementById('reservation_slot').value + ':00',
      party_size:   parseInt(document.getElementById('party_size').value, 10)
    };

    const res = await fetch(API, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrftoken
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const err = await res.json();
      return alert(`Erro ${res.status}: ${err.detail || JSON.stringify(err)}`);
    }

    // Atualiza a lista de reservas
    getBookings();
  });
</script>
{% endblock %}
